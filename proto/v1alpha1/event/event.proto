syntax = "proto3";

package bark.v1alpha1.event;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/blinklabs-io/bark/proto/v1alpha1/event;eventv1alpha1";

// EventService exposes a node's EventBus over the network so components can
// exchange events the same way whether they share a process or not.
//
// Only event types in the node's registry (see ListEventTypes) can be
// subscribed to or published. An unknown type is rejected with
// INVALID_ARGUMENT.
//
// Access control: the protocol carries no credentials of its own, so what a
// caller may do is decided by how a server exposes the service. A server
// SHOULD offer it only on a trusted network or behind its own authentication,
// and MAY reject a call with UNAUTHENTICATED or PERMISSION_DENIED.
// Subscribe, SubscribeWithAck and ListEventTypes only read. Publish writes
// into the receiving node's EventBus, so a server SHOULD leave it disabled
// unless an operator turns it on, and a server that offers it MUST accept
// only registered event types.
service EventService {
  // Subscribe streams events matching the filter until the client cancels or
  // the server detaches it. Delivery is at-most-once: events published while
  // the client is disconnected, or discarded because it fell behind, are not
  // replayed. A subscriber that stops draining its stream is detached rather
  // than allowed to stall the node; use SubscribeWithAck when events must
  // not be lost.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // SubscribeWithAck streams events with at-least-once delivery. The client
  // sends a Start message first, then acknowledges events as it processes
  // them. The server keeps unacknowledged events in a bounded buffer and
  // redelivers them, so a client that reconnects with the last sequence it
  // acknowledged receives everything after it. A client MUST tolerate
  // duplicates and de-duplicate on Event.id.
  rpc SubscribeWithAck(stream SubscribeWithAckRequest) returns (stream SubscribeWithAckResponse);

  // Publish delivers an event to the receiving node's EventBus.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // PublishBatch delivers several events to the receiving node's EventBus.
  // An event that cannot be delivered does not fail the call: the response
  // carries one result per event, in request order. The call itself fails
  // only for a reason that applies to every event, such as the service
  // being disabled or the caller being rejected. The same access rules as
  // Publish apply.
  rpc PublishBatch(PublishBatchRequest) returns (PublishBatchResponse);

  // ListEventTypes returns the event types the node's registry accepts.
  rpc ListEventTypes(ListEventTypesRequest) returns (ListEventTypesResponse);

  // GetEventSchema returns the schema of one event type. It fails with
  // NOT_FOUND when the type is not in the registry.
  rpc GetEventSchema(GetEventSchemaRequest) returns (GetEventSchemaResponse);
}

// EventFilter selects which events a subscriber receives. An event must
// satisfy every field that is set.
message EventFilter {
  // Event types to receive. Each entry is a registered name such as
  // "chain.update", or a category pattern such as "peergov.*" that selects
  // every registered type in that category. A name that is not registered, or
  // a pattern naming no registered category, is rejected with
  // INVALID_ARGUMENT. Empty selects every registered type.
  repeated string event_types = 1;

  // Node identifiers to receive events from, matched against
  // Event.origin_node_id. Empty selects events from any node.
  repeated string origin_node_ids = 2;
}

// Event is the envelope for one event.
message Event {
  // Unique identifier, stable across redelivery. Subscribers de-duplicate
  // on it.
  string id = 1;

  // Registered event type name, such as "chain.update".
  string event_type = 2;

  // Time the event was created on the originating node.
  google.protobuf.Timestamp timestamp = 3;

  // Identifier of the node that created the event. A node MUST NOT forward
  // an event back to the node named here, which prevents loops between
  // nodes.
  string origin_node_id = 4;

  // Position of the event in the serving node's delivery order. It is
  // assigned by the server for each delivery stream, is strictly increasing
  // within it, and is the cursor for resuming SubscribeWithAck. Zero on
  // events sent to Publish.
  uint64 sequence = 5;

  // Typed payload for the event type, when the registry defines one.
  google.protobuf.Any typed_data = 6;

  // Identifies the serving process that assigned sequence. A client resumes
  // with both run_id and sequence because sequence restarts in a new run.
  // Empty on events sent to Publish.
  string run_id = 7;
}

message SubscribeRequest {
  EventFilter filter = 1;
}

message SubscribeResponse {
  Event event = 1;
}

// SubscribeWithAckStart opens a reliable subscription. It MUST be the first
// message on the stream.
message SubscribeWithAckStart {
  EventFilter filter = 1;

  // Identifies this subscription across reconnects. The server keeps the
  // unacknowledged events of a subscriber_id for a bounded time after its
  // stream closes.
  string subscriber_id = 2;

  // Sequence of the last event the client processed. The server resumes
  // with the next event. Zero starts from the current position of the
  // stream. If the requested position is no longer buffered, the server
  // closes the stream with OUT_OF_RANGE, and the client must start over.
  uint64 last_acked_sequence = 3;

  // Run that assigned last_acked_sequence. Empty starts a new subscription
  // at the current position. A different run resumes from the oldest event
  // buffered by the current run.
  string last_acked_run_id = 4;
}

// SubscribeWithAckAck acknowledges every event up to and including
// sequence.
message SubscribeWithAckAck {
  uint64 sequence = 1;
}

message SubscribeWithAckRequest {
  oneof message {
    SubscribeWithAckStart start = 1;
    SubscribeWithAckAck ack = 2;
  }
}

// SubscribeWithAckReady fixes the subscription's resume position before any
// events are delivered.
message SubscribeWithAckReady {
  string run_id = 1;
  uint64 resume_from_sequence = 2;
}

message SubscribeWithAckResponse {
  Event event = 1;
  SubscribeWithAckReady ready = 2;
}

message PublishRequest {
  Event event = 1;
}

message PublishResponse {}

message PublishBatchRequest {
  repeated Event events = 1;
}

message PublishBatchResponse {
  // One result for each event in the request, in the same order.
  repeated PublishBatchResult results = 1;
}

// PublishBatchResult is the outcome of one event in a PublishBatch call.
message PublishBatchResult {
  // Id of the event this result is for.
  string event_id = 1;

  // Set when the event was not delivered. Unset means it was.
  PublishFailure failure = 2;
}

// PublishFailure explains why one event in a batch was not delivered.
message PublishFailure {
  PublishFailureCode code = 1;

  // Human-readable detail. Clients must not parse it.
  string message = 2;
}

enum PublishFailureCode {
  PUBLISH_FAILURE_CODE_UNSPECIFIED = 0;

  // The event is malformed, for example it has no event type.
  PUBLISH_FAILURE_CODE_INVALID_EVENT = 1;

  // The event type is not in the registry.
  PUBLISH_FAILURE_CODE_UNKNOWN_EVENT_TYPE = 2;

  // The node failed to deliver the event.
  PUBLISH_FAILURE_CODE_INTERNAL = 3;
}

message ListEventTypesRequest {}

message ListEventTypesResponse {
  repeated EventTypeInfo event_types = 1;
}

// EventTypeInfo describes one registered event type.
message EventTypeInfo {
  // Event type name, such as "chain.update".
  string name = 1;

  // Subsystem that emits the type, such as "chain". It is the part of the
  // name before the first dot.
  string category = 2;

  // Short human-readable description of when the event is emitted.
  string description = 3;

  // Whether events of this type carry a typed payload in Event.typed_data.
  // When false, typed_data is unset.
  bool has_typed_payload = 4;
}

message GetEventSchemaRequest {
  // Registered event type name, such as "chain.update".
  string event_type = 1;
}

message GetEventSchemaResponse {
  // Description of the event type.
  EventTypeInfo info = 1;

  // Fully qualified name of the message packed into Event.typed_data, such as
  // "bark.v1alpha1.event.ChainUpdateEventData". Empty when the type has no
  // typed payload.
  string payload_message = 2;

  // Definitions of payload_message and everything it references, so a client
  // can decode and describe the payload without compiled-in knowledge of
  // it. Empty when the type has no typed payload.
  google.protobuf.FileDescriptorSet payload_descriptors = 3;
}
